<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1D24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scene Blocker">
<meta name="description" content="Block scenes on floor plans with your crew: cameras, characters, moves and storyboard frames.">
<title>Scene Blocker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=147">
</head>
<body>
<div class="splash" id="splash">
  <img src="assets/icon.svg" alt="" width="96" height="96">
  <h1>Scene Blocker</h1>
  <p class="tag">Block it. Shoot it.</p>
  <div class="bar"><i></i></div>
  <p class="meta">Version <span id="ver">1.4.7</span><br>Developed by Matthew Prins<br>Born 16 November 2026<br><a href="terms.html" style="color:inherit">Terms and privacy</a></p>
</div>
<header class="top">
  <div class="brand"><img src="assets/icon.svg" alt="" width="28" height="28"><span>Scene Blocker</span></div>
  <button class="icon-btn only-mobile" id="btnScenes" aria-label="Scenes">&#9776;</button>
  <div class="title" id="sceneTitle">Import a script to start</div>
  <div class="tabs" id="setupTabs"></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="btnChat" title="Crew chat" hidden>&#128172;<i id="chatDot" hidden></i></button>
  <button class="icon-btn" id="btnFeedback" title="Send feedback">&#9993;</button>
  <button class="icon-btn" id="btnSettings" title="Settings and shortcuts (?)">&#9881;</button>
  <span id="savedTag" class="saved" hidden>Saved</span>
  <button class="btn" id="btnExport" title="Save this setup as a picture">Export</button>
</header>

<main class="layout">
  <aside class="left" id="left">
    <div class="prodrow"><div class="prod" id="prodName">No production yet</div><button class="btn small" id="btnProjects" title="Switch project or start a new one">Projects</button></div>
    <div class="imports">
      <label class="btn red">Import script<input type="file" id="inScript" accept=".pdf,.fdx,.fountain,.txt,.json" hidden></label>
      <label class="btn">Add floor plan<input type="file" id="inPlan" accept="image/*" hidden></label>
      <button class="btn" id="btnSaveFile" title="Save scenes, floor plans, blocking and frames as one file (open it on another device with Import script)">Save file</button>
    </div>
    <input type="search" id="search" placeholder="Search scenes, places or names">
    <ol class="scenes" id="sceneList"></ol>
  </aside>

  <section class="centre">
    <div class="planbar">
      <label>Floor plan for <b id="locName">this location</b>
        <select id="planPick"></select>
      </label>
      <button class="btn small only-mobile" id="btnShot" type="button">Shot list</button>
    </div>
    <div class="stage" id="stage">
      <div class="tools" id="tools">
        <button data-tool="select" class="on" title="Select, move and turn (V)">&#10148;<small>Select</small></button>
        <button data-tool="char" title="Place a character (C)">&#9679;<small>Character</small></button>
        <button data-tool="cam" title="Place a camera (A)">&#9635;<small>Camera</small></button>
        <button data-tool="line180" title="Draw the 180 line (L)">&#8943;<small>180 line</small></button>
        <button data-tool="gear" title="Lights, grip, track, power, VT and vehicles (G)">&#9733;<small>Gear</small></button>
        <button data-tool="props" title="Props (P)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg><small>Props</small></button>
        <button data-tool="cable" title="Extension cable, right angles (E)">&#8988;<small>Cable</small></button>
        <button data-tool="shape" title="Your own labelled shape (S)">&#9634;<small>Shape</small></button>
        <button data-tool="draw" title="Highlight: draw to point something out and add a note (H)">&#9998;<small>Highlight</small></button>
        <span class="sep"></span>
        <button data-act="undo" title="Undo (Ctrl+Z)">&#8630;<small>Undo</small></button>
        <button data-act="redo" title="Redo (Ctrl+Shift+Z)">&#8631;<small>Redo</small></button>
      </div>
      <div class="pick" id="pick"></div>
      <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="empty" id="empty">Import a script, pick a scene, then choose its floor plan.</div>
    </div>
  </section>

  <aside class="right" id="right">
    <div class="ph" id="propHead">Nothing selected</div>
    <div id="props"></div>
  </aside>
</main>

<footer class="board">
  <div class="bh"><b>Storyboard</b> <span id="boardSetup"></span>
    <label class="btn small">Upload frames<input type="file" id="inFrames" accept="image/*" multiple hidden></label></div>
  <div class="frames" id="frames"></div>
</footer>

<div class="toast" id="toast" hidden></div>
<div class="chat" id="chat" hidden style="display:none"><div class="ch"><b>Crew chat</b><button type="button" class="link" id="chatClose">Close &#10005;</button></div><div class="msgs" id="msgs"></div><form id="chatForm"><textarea id="chatIn" rows="2" spellcheck="true" autocorrect="on" autocapitalize="sentences" lang="en-ZA" maxlength="5000" placeholder="Message the crew (Enter sends, Shift+Enter new line)"></textarea><button class="btn red small">Send</button></form></div>
<div class="marquee" id="marquee" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="config.js?v=147"></script>
<script>
  if (window.SB_FIREBASE) ["app", "auth", "firestore"].forEach(m => document.write('<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-' + m + '-compat.js"><\/script>'));
</script>
<script src="sync.js?v=147"></script>
<script src="devseed.js?v=147"></script>
<script src="store.js?v=147"></script>
<script src="parse.js?v=147"></script>
<script src="assets.js?v=147"></script>
<script src="app.js?v=147"></script>
<script>document.getElementById("btnFeedback").onclick = () => window.Sync && Sync.feedback();</script>
<script>document.getElementById("btnShot").onclick = () => document.getElementById("right").classList.toggle("open");</script>
</body>
</html>
